[package]
name = "dnet"
version = "0.1.1"
edition = "2021"
authors = ["zduny <dzduniak@gmail.com>"]
description = "Message passing infrastructure."
license = "MIT"
repository = "https://github.com/druntime/dnet"
documentation = "https://docs.rs/dnet/"
keywords = ["message", "message-passing", "communication"]
categories = ["network-programming"]

[package.metadata.docs.rs]
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

[features]
default = [
    "codecs",
    "utils",
    "rpc",
    "io",
    "tcp",
    "udp",
    "quic",
    "websocket",
    "message_port",
    "webworker",
]
logging = [
    "dnet-base/logging",
    "dnet-tests/logging",
    "dnet-utils/logging",
    "dnet-js/logging",
]
utils = ["dnet-utils"]
codecs = ["dnet-codecs"]
rpc = ["dnet-rpc"]
io = ["tokio", "tokio-util", "bytes"]
tcp = ["io"]
udp = ["tokio"]
quic = ["io", "quinn"]
websocket = [
    "utils",
    "tokio",
    "native-tls",
    "tungstenite",
    "tokio-tungstenite",
    "axum",
]
message_port = ["utils", "dnet-macros"]
webworker = ["utils", "message_port", "dnet-macros"]

[dependencies]
dnet-base = { workspace = true }
dnet-js = { workspace = true }
dnet-macros = { workspace = true, optional = true }
dnet-utils = { workspace = true, optional = true }
dnet-codecs = { workspace = true, optional = true }
dnet-rpc = { workspace = true, optional = true }
serde = { workspace = true }
futures = { workspace = true }
pin-project = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["net"], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
bytes = { version = "1.11", optional = true }
tungstenite = { version = "0.29", optional = true }
native-tls = { version = "0.2", optional = true }
tokio-tungstenite = { version = "0.29", features = [
    "native-tls",
], optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
quinn = { version = "0.11", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
js-utils = { workspace = true }
web-sys = { version = "0.3", features = [
    "WebSocket",
    "BinaryType",
    "Event",
    "MessageEvent",
    "CloseEvent",
    "MessageChannel",
    "MessagePort",
    "Worker",
    "DedicatedWorkerGlobalScope",
    "WorkerOptions",
    "WorkerType",
    "Blob",
    "BlobPropertyBag",
    "Url",
] }

[dev-dependencies]
dnet-tests = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# examples
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rustyline-async = "0.4"
tokio-stream = "0.1"

# IPC example
parity-tokio-ipc = "0.9"

# RPC example
chrono = { version = "0.4", features = ["serde"] }

# UDP and QUIC examples
device_query = "4"

# QUIC example
rcgen = "0.14"
rustls = "0.23"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
