[package]
name = "dnet-codecs"
version = "0.1.0"
edition = "2021"
authors = ["zduny <dzduniak@gmail.com>"]
description = "Codecs for dnet"
license = "MIT"
repository = "https://github.com/druntime/dnet"
documentation = "https://docs.rs/dnet-codecs/"
keywords = ["message", "message-passing", "communication", "codecs"]
categories = ["network-programming"]

[features]
default = ["bincode", "json"]
json = ["serde_json"]

[dependencies]
dnet-base = { workspace = true }
serde = { workspace = true }
bincode = { version = "2", default-features = false, features = [
    "std",
    "serde",
], optional = true }
serde_json = { version = "1", optional = true }
