[package]
name = "dnet-macros"
version = "0.1.0"
edition = "2021"
authors = ["zduny <dzduniak@gmail.com>"]
description = "Macros for dnet"
license = "MIT"
repository = "https://github.com/druntime/dnet"
documentation = "https://docs.rs/dnet-macros/"
keywords = ["message", "message-passing", "communication", "macros"]
categories = ["network-programming"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
proc-macro-crate = "3"
quote = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
convert_case = "0.11"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
prettyplease = "0.2"
