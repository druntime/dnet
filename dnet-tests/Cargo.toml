[package]
name = "dnet-tests"
version = "0.1.0"
edition = "2021"
authors = ["zduny <dzduniak@gmail.com>"]
description = "Testing utilities for dnet"
license = "MIT"
repository = "https://github.com/druntime/dnet"
documentation = "https://docs.rs/dnet-tests/"
keywords = ["message", "message-passing", "communication", "testing"]
categories = ["network-programming"]

[package.metadata.docs.rs]
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

[features]
default = []
logging = ["dnet-base/logging"]

[dependencies]
dnet-base = { workspace = true  }
dportable = { workspace = true }
futures = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version= "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing = { workspace = true }
wasm-bindgen-test = { workspace = true }
wasm-tracing = "2.1"
