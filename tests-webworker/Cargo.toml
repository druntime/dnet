[package]
name = "tests-webworker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dnet = { path = "../dnet", default-features = false, features = ["logging", "webworker", "codecs"] }
dnet-tests = { path = "../dnet-tests", features = ["logging"] }
futures = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
js-utils = "0.1"
web-sys = { version = "0.3", features = [
    "DedicatedWorkerGlobalScope",
    "MessageEvent",
    "MessagePort",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = "0.23"
