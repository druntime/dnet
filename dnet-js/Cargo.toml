[package]
name = "dnet-js"
version = "0.1.2"
edition = "2021"
authors = ["zduny <dzduniak@gmail.com>"]
description = "JavaScript transport base for dnet"
license = "MIT"
repository = "https://github.com/druntime/dnet"
documentation = "https://docs.rs/dnet-js/"
keywords = ["message", "message-passing", "communication", "js"]
categories = ["network-programming"]

[package.metadata.docs.rs]
targets = [
    "wasm32-unknown-unknown",
]

[features]
default = []
logging = ["dnet-base/logging", "dnet-tests/logging"]

[dependencies]
dnet-base = { workspace = true }
dnet-macros = { workspace = true }
dnet-utils = { workspace = true }
serde = { workspace = true }
futures = { workspace = true }
pin-project = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
js-utils = { workspace = true }
web-sys = { version = "0.3", features = [
    "Event",
    "EventTarget",
    "MessageEvent",
    "MessageChannel",
    "MessagePort",
    "Worker",
    "DedicatedWorkerGlobalScope",
] }

[dev-dependencies]
dnet-tests = { workspace = true }
dnet-codecs = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
