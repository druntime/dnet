<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Transferable dnet example</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Transferable dnet example</h1>
  <div id="wrapper">
    <canvas id="canvas"></canvas>
  </div>
  <div class="controls">
    <label>
      Light X
      <input type="range" id="light-x" min="-5" max="5" step="0.01" value="2"
        oninput="this.nextElementSibling.textContent=parseFloat(this.value).toFixed(2)">
      <span>2.00</span>
    </label>
    <label>
      Light Y
      <input type="range" id="light-y" min="-5" max="5" step="0.01" value="2"
        oninput="this.nextElementSibling.textContent=parseFloat(this.value).toFixed(2)">
      <span>2.00</span>
    </label>
    <label>
      Light Z
      <input type="range" id="light-z" min="-5" max="5" step="0.01" value="2"
        oninput="this.nextElementSibling.textContent=parseFloat(this.value).toFixed(2)">
      <span>2.00</span>
    </label>
    <label>
      Shininess
      <input type="range" id="shininess" min="1" max="128" step="1" value="32"
        oninput="this.nextElementSibling.textContent=this.value">
      <span>32</span>
    </label>
    <label>
      Speed
      <input type="range" id="speed" min="0" max="3" step="0.01" value="1"
        oninput="this.nextElementSibling.textContent=parseFloat(this.value).toFixed(2)">
      <span>1.00</span>
    </label>
  </div>
  <script type="module" src="starter.js"></script>
  <p><a href="https://github.com/druntime/dnet/tree/main/dnet/examples/transferable" target="_blank" rel="noopener">View example source on GitHub</a></p>
  <noscript>
    This page contains webassembly and javascript content,
    please enable javascript in your browser.
  </noscript>
</body>

</html>
